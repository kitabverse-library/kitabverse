<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - KitabVerse</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-login-container { max-width: 400px; margin: 80px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .admin-login-container h2 { text-align: center; color: #1a1a2e; margin-bottom: 25px; }
    .admin-login-container input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    .admin-login-container button { width: 100%; padding: 12px; background: #1a1a2e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .admin-login-container button:hover { background: #16213e; }
    #err { display:none; background:#ffe0e0; color:#c00; padding:10px; border-radius:6px; margin-top:15px; text-align:center; }
  </style>
</head>
<body>
  <div class="admin-login-container">
    <h2>🔒 KitabVerse Admin</h2>
    <input type="email" id="adminEmail" placeholder="Admin Email" autocomplete="email">
    <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password">
    <button onclick="adminLogin()">Secure Login</button>
    <div id="err"></div>
    <p style="text-align:center; margin-top:15px; font-size:12px; color:#888;">Protected by Firebase Auth + 2FA</p>
  </div>

  <!-- Firebase SDKs - Use your existing config -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script> <!-- Your existing config file -->
  <script src="js/adminAuth.js"></script>
</body>
</html>
