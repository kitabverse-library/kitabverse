<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - KitabVerse</title>
<style>
body{font-family:system-ui;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);width:100%;max-width:380px}
h2{text-align:center;margin-bottom:20px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-top:10px}
button:hover{background:#16213e}
.error{color:red;text-align:center;margin-top:10px;display:none;background:#ffe0e0;padding:10px;border-radius:6px}
</style>
</head>
<body>
<div class="card">
<h2>📚 KitabVerse Admin</h2>
<form id="loginForm">
<input type="email" id="email" placeholder="Admin Email" required value="kitabverse.library@gmail.com">
<input type="password" id="password" placeholder="Password" required>
<button type="submit" id="loginBtn">Secure Login</button>
<p id="error" class="error"></p>
</form>
<p style="text-align:center;margin-top:15px;font-size:12px;color:#888;">Protected by Firebase Auth + 2FA</p>
</div>
<script type="module">
import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './js/firebase.js';
onAuthStateChanged(auth, (user) => { if (user) { window.location.href = 'admin-dashboard.html'; } });
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('error');
const btn = document.getElementById('loginBtn');
form.addEventListener('submit', async (e) => {
e.preventDefault();
errorEl.style.display = 'none';
btn.textContent = 'Logging in...';
btn.disabled = true;
try {
await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
window.location.href = 'admin-dashboard.html';
} catch (err) {
errorEl.textContent = err.message;
errorEl.style.display = 'block';
btn.textContent = 'Secure Login';
btn.disabled = false;
}
});
</script>
</body>
</html>
