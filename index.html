<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KitabVerse - A Premium Digital Library</title>
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="header-left">
    <img src="assets/logo.png" class="header-logo" alt="KitabVerse" />
  </div>
  <nav class="header-nav">
    <button>🔍 Search</button>
    <button>📺 TV Cast</button>
    <button>📷 Scan</button>
    <button>🎁 Donor</button>
    <button>🎙️ Voice</button>
    <button>👤 Profile</button>
  </nav>
</header>

<div class="welcome-box">
  <h2>Welcome To KitabVerse</h2>
  <p>A Premium Digital Library</p>
</div>

<section class="hero">
  <div class="hero-logo"><img src="assets/logo.png" alt="KitabVerse" /></div>
  <h1>The Most Premium Digital Library Experience</h1>
  <p>A community-driven library to discover, donate and share knowledge</p>
</section>

<section class="search-section">
  <div class="search-box">
    <input type="text" placeholder="Search by book title, author or category..." />
    <button class="mic-btn">🎙️</button>
    <button class="search-btn">Search</button>
  </div>
  <div class="search-chips">
    <span>Fiction</span><span>Poetry</span><span>Kannada</span><span>Tulu</span><span>English</span><span>Mystery</span>
  </div>
</section>

<footer class="footer">
  <p>© 2026 KitabVerse — READ. SHARE. CONNECT.</p>
  <p class="powered">Powered By GitHub With Advanced Features</p>
</footer>

</body>
  </html>
