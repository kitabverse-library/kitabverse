<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020c1b;color:#e6e6e6;font-family:'Montserrat',sans-serif}
.header{display:flex;align-items:center;gap:14px;padding:14px 5%;background:#020c1b;border-bottom:1px solid #d4af3715}
.logo-circle{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#020c1b;flex-shrink:0;box-shadow:0 0 0 1px #d4af3730}
.brand-text{line-height:1}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:28px;color:#d4af37;letter-spacing:1px;font-weight:400}
.brand-tag{font-family:'Cormorant Garamond',serif;font-size:11px;color:#e8c873;letter-spacing:1.5px;margin-top:2px;opacity:0.9}
.hero{text-align:center;padding:30px 20px 50px}
.hero-circle{width:340px;height:340px;max-width:85vw;max-height:85vw;border-radius:50%;object-fit:cover;display:block;margin:0 auto;background:#020c1b;box-shadow:0 0 40px #d4af3720, 0 0 0 1px #d4af3710}
.hero-tag{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:4px;color:#e8c873;margin-top:28px;font-weight:300}
.hero-line{width:340px;max-width:80vw;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:12px auto;position:relative}
.hero-line::before,.hero-line::after{content:'◆';position:absolute;top:-6px;font-size:7px;color:#d4af37}
.hero-line::before{left:0}.hero-line::after{right:0}
.desc{color:#8892b0;max-width:580px;margin:22px auto 0;line-height:1.8;font-size:15px}
.search{max-width:520px;margin:32px auto;display:flex;background:#112240;border:1px solid #d4af3730;border-radius:30px;overflow:hidden;box-shadow:0 4px 20px #00000030}
.search input{flex:1;background:transparent;border:none;padding:16px 22px;color:white;outline:none;font-size:15px}
.search button{background:#d4af37;border:none;padding:0 32px;font-weight:700;color:#020c1b;cursor:pointer;font-size:14px;letter-spacing:0.5px}
.btn{background:#d4af37;color:#020c1b;padding:15px 40px;border-radius:30px;text-decoration:none;font-weight:700;display:inline-block;margin-top:20px;letter-spacing:0.3px}
.footer{text-align:center;padding:30px;color:#5a6a8a;font-size:12px;border-top:1px solid #ffffff08;margin-top:50px}
</style>
</head>
<body>

<div class="header">
<img src="logo.jpg?v=8" class="logo-circle" alt="KitabVerse">
<div class="brand-text">
<div class="brand-name">KitabVerse</div>
<div class="brand-tag">Read. Share. Connect.</div>
</div>
</div>

<div class="hero">
<img src="logo.jpg?v=8" class="hero-circle" alt="KitabVerse Logo">
<div class="hero-tag">READ. SHARE. CONNECT.</div>
<div class="hero-line"></div>
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
<a href="#" class="btn">Explore Library →</a>
</div>

<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai</div>

</body>
  </html>
