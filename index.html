<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial;background:#F8FAFC;color:#1A202C;font-size:16px;line-height:1.5}
<header style="background:#0B1D3A;color:#fff;text-align:center;font-family:Poppins,Arial">
  <!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<header style="background:#0B1D3A;color:#fff;text-align:center;font-family:Poppins,Arial;overflow:hidden">

  <!-- 🇮🇳 TOP — FLAG + ANTHEM — OPTION A -->
  <div style="background:#fff;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap">
    <img src="assets/india-flag.png" alt="India Flag" style="height:32px;width:auto;border-radius:4px">
    <span style="color:#0B1D3A;font-size:12px;font-weight:800">Jana Gana Mana • National Anthem</span>
    <audio id="anthem" src="assets/anthem.mp3" preload="none"></audio>
    <button onclick="let a=document.getElementById('anthem'); if(a.paused){a.play();this.innerHTML='⏸️ Pause'}else{a.pause();this.innerHTML='▶️ Play Anthem'}" style="background:#0B1D3A;color:#FFD700;border:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer">▶️ Play Anthem</button>
  </div>

  <!-- LOGO -->
  <div style="padding-top:16px">
    <img src="assets/logo.png" style="width:72px;height:72px;border-radius:50%;border:2px solid #FFD700;object-fit:cover;background:#fff">
  </div>

  <!-- KitabVerse -->
  <div style="font-family:'Playfair Display',serif;font-size:32px;font-weight:900;margin-top:10px;line-height:1">
    <span style="color:#fff">Kitab</span><span style="color:#FFD700">Verse</span>
  </div>

  <!-- LINE 2 + 3 -->
  <div style="font-size:11px;color:#CBD5E1;margin-top:6px;padding:0 14px 16px;line-height:1.6">
    Library For All With Advanced Features<br>
    Designed Following IFLA Guidelines • Quality Process Inspired By ISO 9001:2015 Principles
  </div>

<div class="search"><input id="q" placeholder="Search books, authors..."><button onclick="doSearch()">Search</button></div>
<div class="tools">
<button onclick="toggleNight()">🌙 Night</button><button onclick="speakBook()">🔊 Voice</button>
<button onclick="toggleBraille()">⠿ Braille</button><button onclick="toggleHearing()">🦻 Inclusive</button>
<button onclick="zoomIn()">A+ </button><button onclick="zoomOut()">A- </button>
</div>
</header>

<div class="wrap">

<!-- 1. Quote - Clean -->
<div class="card" style="text-align:center;background:#FFFBEB">
<span class="badge">Daily Inspiration</span>
<p id="quoteText" style="font-size:19px;font-style:italic;margin:12px 0 4px">"A reader lives a thousand lives before he dies."</p>
<p id="quoteAuthor" class="muted">— George R.R. Martin</p>
<div style="display:flex;gap:8px"><button class="btn" onclick="newQuote()">New Quote</button><button class="btn btn-gold" onclick="copyQuote()">📋 Copy</button></div>
</div>

<!-- 2. OPAC - Professional -->
<div class="card"><h3>📚 Library Catalogue — OPAC</h3>
<div class="grid"><div><b>26</b><br><span class="muted">Titles</span></div><div><b>3</b><br><span class="muted">Members</span></div><div><b>0</b><br><span class="muted">Checkouts</span></div></div>
<p class="muted" style="margin-top:10px">New Arrivals: Mogaveera, Saphala Traimasika • No Overdue Items</p>
</div>

<!-- 3. Collapsible - No Clutter -->
<details><summary>📺 TV Cast & 🌐 Web Browser — Instructions</summary>
<p class="muted">Phone & TV same Wi-Fi par rakhein. Android: Smart View / Cast. iPhone: Screen Mirroring. Na chale toh TV Browser me likhein: <b>kitabverse-library.github.io/kitabverse</b></p>
<button class="btn" onclick="castTV()">Open TV Cast Help</button>
</details>

<details><summary>🧭 Live Compass & Directions</summary>
<p style="text-align:center;font-size:26px" id="compass">🧭 N</p>
<button class="btn" onclick="openMap()">Open Directions</button>
</details>

<details><summary>📱 Devices — Mobile / Desktop / PC</summary>
<p class="muted">One website works on all devices. No separate app required. Mobile, Desktop & PC / Laptop — fully responsive.</p>
</details>

<!-- 4. Upload - Members Only - Collapsed -->
<details><summary>📤 Contribute — Upload PDF (Members Only)</summary>
<p class="muted">Any language allowed. Only your own work. Pirated copies are not allowed and will be removed.</p>
<select id="lang"><option>Hindi</option><option>English</option><option>Marathi</option><option>Tamil</option><option>Urdu</option><option>Other</option></select>
<input type="file" id="pdfFile" accept=".pdf">
<input id="memberName" placeholder="Member Name / Member ID">
<input id="memberSign" placeholder="Your Sign / Signature">
<label style="font-size:13px"><input type="checkbox" id="ownWork" style="width:auto"> I confirm this is my own work — No pirated copy</label>
<button class="btn" style="margin-top:10px" onclick="uploadPDF()">Upload With Watermark</button>
<div id="pdfList"></div>
</details>

<!-- Admin Quote - Only For Admin, Hidden -->
<details><summary>⚙️ Admin — Add Quote / Visitor Control</summary>
<input id="adminQuote" placeholder="Admin Quote"><input id="adminAuthor" placeholder="Author Name">
<button class="btn" style="background:#15803D" onclick="adminAddQuote()">Add Admin Quote</button>
<div style="margin-top:12px">
<input id="adminContact" placeholder="Admin Email / WhatsApp / Mobile">
<button class="btn btn-gold" onclick="sendOTP()">Send OTP</button>
<div id="otpBox" style="display:none"><input id="otpInput" placeholder="OTP — Demo: 1234"><button class="btn" onclick="verifyOTP()">Verify OTP</button></div>
<div id="adminPanel" style="display:none;margin-top:10px;background:#F1F5F9;padding:10px;border-radius:10px">
Total Visitors: <b id="adminVisitorCount">0</b><br>
<button class="btn" style="margin-top:8px" onclick="resetCounter()">Reset Counter</button>
</div>
</div>
</details>

<!-- Visitor - Clean, Not Loud -->
<p style="text-align:center" class="muted">👀 Visitors: <b id="visitorCount" style="color:#0B1D3A">1,248</b> • Privacy Protected — No personal data collected without consent</p>

</div>

<footer>
<a href="#">Privacy Policy</a> • <a href="#">Terms</a> • <a href="#">Help</a> • <a href="#">Data Safety</a><br>
KitabVerse © 2026 • Library For All<br>
<span class="muted">This website follows IFLA library guidelines and ISO 9001:2015 quality principles. Not ISO certified. Content is protected for reading only.</span>
</footer>

<script>
// Visitor
let vc=parseInt(localStorage.getItem('kitabverse_visitors')||1248); vc++; localStorage.setItem('kitabverse_visitors',vc); document.getElementById('visitorCount').innerText=vc; document.getElementById('adminVisitorCount').innerText=vc;
function sendOTP(){let c=document.getElementById('adminContact').value; if(!c){alert('Email / WhatsApp / Mobile likhein');return} document.getElementById('otpBox').style.display='block'; alert('OTP sent to '+c+' — Demo OTP: 1234');}
function verifyOTP(){if(document.getElementById('otpInput').value==='1234'){document.getElementById('adminPanel').style.display='block'; alert('Admin Verified ✅')}else alert('Wrong OTP')}
function resetCounter(){localStorage.setItem('kitabverse_visitors',0); document.getElementById('visitorCount').innerText=0; alert('Reset done')}
// Tools
function toggleNight(){document.body.classList.toggle('night')}
let sz=16; function zoomIn(){sz+=2;document.body.style.fontSize=sz+'px'} function zoomOut(){sz-=2;document.body.style.fontSize=sz+'px'}
function speakBook(){let s=new SpeechSynthesisUtterance(document.body.innerText); s.lang='hi-IN'; s.rate=0.9; speechSynthesis.speak(s)} 
function toggleHearing(){let b=document.getElementById('captionBox'); let on=b.style.display!=='block'; b.style.display=on?'block':'none'; if(on && navigator.vibrate) navigator.vibrate([200,100,200]); alert(on?'🦻 Inclusive Mode ON — Visual Captions + Vibration ON':'🦻 Inclusive Mode OFF')}
const bm={a:'⠁',b:'⠃',c:'⠉',d:'⠙',e:'⠑',f:'⠋',g:'⠛',h:'⠓',i:'⠊',j:'⠚',k:'⠅',l:'⠇',m:'⠍',n:'⠝',o:'⠕',p:'⠏',q:'⠟',r:'⠗',s:'⠎',t:'⠞',u:'⠥',v:'⠧',w:'⠺',x:'⠭',y:'⠽',z:'⠛',' ':' '}; let bon=false;
function toggleBraille(){if(!bon){document.querySelectorAll('h3,p,button').forEach(e=>{if(!e.dataset.orig)e.dataset.orig=e.innerText; e.innerText=e.innerText.toLowerCase().split('').map(c=>bm[c]||c).join('')});bon=true;alert('⠿ Braille ON')}else{document.querySelectorAll('h3,p,button').forEach(e=>{if(e.dataset.orig)e.innerText=e.dataset.orig});bon=false;alert('Braille OFF')}}
// Quote
let aq=JSON.parse(localStorage.getItem('kitabverse_admin_quotes')||'[]');
async function newQuote(){if(aq.length>0 && Math.random()>0.5){let q=aq[Math.floor(Math.random()*aq.length)]; document.getElementById('quoteText').innerText='"'+q.text+'"'; document.getElementById('quoteAuthor').innerText='— '+q.author; return} try{let r=await fetch('https://api.quotable.io/random?tags=famous-quotes|wisdom|inspirational'); let d=await r.json(); document.getElementById('quoteText').innerText='"'+d.content+'"'; document.getElementById('quoteAuthor').innerText='— '+d.author}catch(e){let f=[{text:'So many books, so little time.',author:'Frank Zappa'},{text:'A room without books is like a body without a soul.',author:'Cicero'}]; let q=f[Math.floor(Math.random()*f.length)]; document.getElementById('quoteText').innerText='"'+q.text+'"'; document.getElementById('quoteAuthor').innerText='— '+q.author}}
function copyQuote(){navigator.clipboard.writeText(document.getElementById('quoteText').innerText+' '+document.getElementById('quoteAuthor').innerText); alert('Copy ho gaya ✅')}
function adminAddQuote(){let t=document.getElementById('adminQuote').value; let a=document.getElementById('adminAuthor').value||'KitabVerse Admin'; if(!t){alert('Quote likhein');return} aq.push({text:t,author:a}); localStorage.setItem('kitabverse_admin_quotes',JSON.stringify(aq)); alert('Admin Quote Added ✅')}
newQuote();
// Others
function doSearch(){alert('Searching: '+document.getElementById('q').value)}
function openMap(){window.open('https://www.google.com/maps/search/library+near+me','_blank')}
function castTV(){alert('TV Cast: Smart View / Screen Mirroring se TV select karein.')}
if(window.DeviceOrientationEvent){window.addEventListener('deviceorientation',e=>{if(e.alpha!=null) document.getElementById('compass').innerText='🧭 '+Math.round(e.alpha)+'°'})}
function uploadPDF(){if(!document.getElementById('ownWork').checked){alert('Please confirm — This is my own work');return} if(!document.getElementById('memberName').value){alert('Member Name / ID likhein');return} let f=document.getElementById('pdfFile').files[0]; if(!f){alert('PDF select karein');return} document.getElementById('pdfList').innerHTML+='<p>✅ '+f.name+' | By: '+document.getElementById('memberName').value+' | Watermarked © KitabVerse</p>'; alert('Upload ho gaya — Watermark ke saath')}
// Protection - Click pe Blur NAHI hoga - Sirf Copy/Right-click soft block
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='PrintScreen'||(e.ctrlKey&&['p','u'].includes(e.key.toLowerCase()))){e.preventDefault(); alert('Protected — KitabVerse')}});
</script>
</body>
</html>
