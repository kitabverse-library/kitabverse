<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Library For All With Advanced Features</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e8d5a3;font-family:'Inter',system-ui,sans-serif}
.topbar{background:#000;padding:18px;text-align:center;border-bottom:1px solid #1a1a1a}
.logo{font-family:'Great Vibes',cursive;font-size:42px;color:#d4b86a;line-height:1}
.tag1{font-size:12px;letter-spacing:3.5px;font-weight:700;color:#d4b86a;margin-top:4px;text-transform:uppercase}
.tag2{font-size:11px;letter-spacing:2px;color:#b89a4e;margin-top:4px;text-transform:uppercase}
.banner{width:100%;background:#000}
.banner img{width:100%;display:block}
.anthem-box{text-align:center;padding:32px 16px;background:#000}
.anthem-title{font-family:'Great Vibes',cursive;font-size:56px;color:#d4b86a}
.audio-wrap{background:#ececef;border-radius:28px;padding:12px 16px;max-width:540px;margin:18px auto 0}
.anthem-note{font-family:'Great Vibes',cursive;margin-top:16px;font-size:22px;color:#d4b86a}
.anthem-note b{display:block;font-family:'Inter',sans-serif;letter-spacing:3px;font-size:11.5px;font-weight:800;margin-top:6px}
.search-gold{margin:24px 16px;border:1.5px solid #d4b86a;border-radius:32px;padding:6px 12px;display:flex;align-items:center;background:#000}
.search-gold input{flex:1;background:transparent;border:0;padding:12px 8px;color:#fff;outline:none;font-size:14.5px}
.s-ic{width:36px;height:36px;border-radius:50%;border:1px solid #d4b86a;background:#000;display:grid;place-items:center;margin-left:7px;color:#d4b86a}
.results{padding:12px;background:#f5f5f7;display:grid;gap:10px;min-height:200px}
.card{background:#fff;border-radius:18px;padding:14px;color:#111}
.meta{font-size:12.5px;color:#777;margin-top:4px}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">KitabVerse</div>
<div class="tag1">Read. Share. Connect.</div>
<div class="tag2">Library For All With Advanced Features</div>
</div>
<div class="banner"><img src="assets/header.jpg" alt="KitabVerse"></div>
<div class="anthem-box">
<div class="anthem-title">National Anthem</div>
<div class="audio-wrap"><audio controls style="width:100%"><source src="assets/anthem.mp3" type="audio/mpeg"></audio></div>
<div class="anthem-note">Please Respect The National Anthem<br><b>STAND IN HONOUR</b></div>
</div>
<div class="search-gold"><span>🔍</span><input id="q" placeholder="Search in Kannada • Tulu • Hindi • English..." oninput="doSearch(this.value)"><button class="s-ic">🌐</button><button class="s-ic">🎤</button><button class="s-ic">👆</button><button class="s-ic">⋮</button></div>
<div id="results" class="results"></div>
<script>
const books=[{title:"Speaking Shadows - Echoes from the Silent Corners",author:"Your Collection",lang:"English",cat:"Your Book - English",e:"🌑"},{title:"Dreams Take Flight",author:"You - Debut Novella",lang:"English",cat:"Your Book - English",e:"✈️"},{title:"Dreams Take Flight - Hindi Edition",author:"You - Hindi",lang:"Hindi",cat:"Your Book - Hindi",e:"✈️"}];
function render(a){document.getElementById('results').innerHTML=a.map(b=>`<div class="card"><b>${b.e} ${b.title}</b><div class="meta">${b.author} • ${b.lang} • 📖 ${b.cat}</div></div>`).join('')}
function doSearch(q){q=(q||'').toLowerCase().trim();if(!q){render(books);return}render(books.filter(b=>b.title.toLowerCase().includes(q)||b.lang.toLowerCase().includes(q)))}
render(books);
</script>
</body>
</html>
