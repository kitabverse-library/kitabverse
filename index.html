<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020c1b;color:#e6e6e6;font-family:'Segoe UI',sans-serif;position:relative;overflow-x:hidden}

/* Faint watermark background - using perfect logo */
body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:700px;height:700px;
  background:url('logo.jpg?v=21') no-repeat center/contain;
  opacity:0.03;
  pointer-events:none;
  z-index:0;
}

.header{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:12px;
  padding:12px 4%;
  background:#020c1b;
  border-bottom:1px solid rgba(212,175,55,0.08);
}
.logo-circle{
  width:56px;height:56px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#020c1b;
  border:1px solid rgba(212,175,55,0.15);
}
.brand{line-height:1;white-space:nowrap}
.brand-name{
  font-family:'Great Vibes',cursive;
  font-size:36px;
  color:#d4af37;
  white-space:nowrap;
  display:flex;align-items:baseline;
}
.brand-name .sm{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:20px;
  font-weight:300;
  margin-top:4px;
}

.hero{
  position:relative;z-index:1;
  text-align:center;
  padding:20px 16px 60px;
}
.hero-circle{
  width:360px;height:360px;
  max-width:88vw;max-height:88vw;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto;
  background:#020c1b;
  box-shadow:0 0 40px rgba(212,175,55,0.12);
  border:1px solid rgba(212,175,55,0.1);
}
.hero-name{
  font-family:'Great Vibes',cursive;
  font-size:72px;
  color:#d4af37;
  margin-top:18px;
  white-space:nowrap;
  display:flex;justify-content:center;align-items:baseline;
  gap:4px;
  line-height:1;
}
.hero-name .sm{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:36px;
  font-weight:300;
}
.hero-tag{
  font-family:'Cormorant Garamond',serif;
  letter-spacing:5px;
  color:#e8c873;
  font-size:13px;
  margin-top:8px;
  text-transform:uppercase;
}
.desc{
  color:#8892b0;
  max-width:560px;
  margin:18px auto 0;
  line-height:1.7;
  font-size:13.5px;
}
.search{
  max-width:520px;
  margin:26px auto 0;
  display:flex;
  background:#112240;
  border:1px solid rgba(212,175,55,0.18);
  border-radius:30px;
  overflow:hidden;
}
.search input{
  flex:1;
  background:transparent;
  border:none;
  padding:15px 20px;
  color:white;
  outline:none;
  font-size:14px;
}
.search button{
  background:#d4af37;
  border:none;
  padding:0 28px;
  font-weight:700;
  color:#020c1b;
  cursor:pointer;
  font-size:14px;
}
.footer{
  position:relative;z-index:1;
  text-align:center;
  padding:30px;
  color:#5a6a8a;
  font-size:11px;
  border-top:1px solid rgba(255,255,255,0.04);
  margin-top:30px;
}
@media(max-width:480px){
  .hero-name{font-size:52px}
  .hero-name .sm{font-size:26px}
  .hero-circle{width:300px;height:300px}
  .brand-name{font-size:30px}
}
</style>
</head>
<body>

<div class="header">
  <img src="logo.jpg?v=21" alt="KitabVerse" class="logo-circle">
  <div class="brand">
    <div class="brand-name">K<span class="sm">itab</span><span style="margin-left:5px">V</span><span class="sm">erse</span></div>
  </div>
</div>

<div class="hero">
  <img src="logo.jpg?v=21" alt="KitabVerse" class="hero-circle">
  <div class="hero-name">K<span class="sm">itab</span><span style="margin-left:6px">V</span><span class="sm">erse</span></div>
  <div class="hero-tag">Read. Share. Connect.</div>
  <div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
  <div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>

<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>

</body>
  </html>
