<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#070b14;background:radial-gradient(1200px 600px at 50% -10%, #132040 0%, #070b14 55%, #05080f 100%);color:#e6e6e6;font-family:'Inter','Segoe UI',sans-serif;width:100%;min-height:100vh;display:block;overflow-x:hidden}
.header{display:flex;align-items:center;gap:12px;padding:12px 5%;background:rgba(7,11,20,0.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,175,55,0.10);position:sticky;top:0;z-index:10}
.logo-circle{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#070b14;border:1px solid rgba(212,175,55,0.20);flex-shrink:0}
.brand-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand-name{font-family:'Great Vibes',cursive;font-size:30px;color:#d4af37;display:flex;align-items:baseline;white-space:nowrap;letter-spacing:0.5px;line-height:1}
.brand-name .sm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;font-weight:300}
.divider{width:1px;height:22px;background:rgba(212,175,55,0.25);margin:0 2px}
.tagline{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#8a9ab8;font-weight:400;white-space:nowrap}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 16px 32px}
.hero-circle{width:360px;height:360px;max-width:82vw;max-height:82vw;border-radius:50%;object-fit:cover;display:block;background:#070b14;box-shadow:0 0 0 1px rgba(212,175,55,0.12), 0 0 80px rgba(212,175,55,0.20), 0 20px 60px rgba(0,0,0,0.6)}
.desc{color:#8a96b3;max-width:520px;margin:30px auto 0;line-height:1.7;font-size:14.5px;padding:0 12px;font-weight:300}
.search{width:100%;max-width:520px;margin:32px auto 0;display:flex;background:rgba(17,34,64,0.9);border:1px solid rgba(212,175,55,0.22);border-radius:32px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.search input{flex:1;background:transparent;border:none;padding:16px 22px;color:white;outline:none;font-size:14.5px}
.search input::placeholder{color:#5a6a8a}
.search button{background:linear-gradient(135deg,#d4af37,#f0d27a);border:none;padding:0 32px;font-weight:700;color:#070b14;cursor:pointer}
.footer{text-align:center;padding:26px 10px 80px;color:#4e5e7a;font-size:11px;border-top:1px solid rgba(255,255,255,0.05);margin-top:20px}
@media(max-width:480px){
.brand-wrap{gap:8px}
.divider{display:none}
.tagline{font-size:9px;letter-spacing:1.5px;width:100%;margin-left:2px}
}
@media(max-width:768px){
.hero-circle{width:300px;height:300px}
}
</style>
</head>
<body>
<div class="header">
<img src="logo.jpg?v=31" class="logo-circle">
<div class="brand-wrap">
<div class="brand-name">K<span class="sm">itab</span><span style="margin-left:3px">V</span><span class="sm">erse</span></div>
<div class="divider"></div>
<div class="tagline">Read. Share. Connect.</div>
</div>
</div>
<div class="hero">
<img src="logo.jpg?v=31" class="hero-circle">
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>
<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>
</body>
</html>
