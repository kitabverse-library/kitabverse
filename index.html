<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020c1b;color:#e6e6e6;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:10px;padding:14px 5%;background:#020c1b;border-bottom:1px solid rgba(212,175,55,0.08)}
.logo-circle{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#020c1b;border:1px solid rgba(212,175,55,0.18)}
.brand-name{font-family:'Great Vibes',cursive;font-size:28px;color:#d4af37;white-space:nowrap;display:flex;align-items:baseline}
.brand-name .sm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;font-weight:300}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 16px 40px}
.hero-circle{width:380px;height:380px;max-width:84vw;max-height:84vw;border-radius:50%;object-fit:cover;display:block;background:#020c1b;box-shadow:0 0 60px rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.1)}
.desc{color:#8892b0;max-width:520px;margin:24px auto 0;line-height:1.65;font-size:14px}
.search{width:100%;max-width:500px;margin:26px auto 0;display:flex;background:#112240;border:1px solid rgba(212,175,55,0.2);border-radius:30px;overflow:hidden}
.search input{flex:1;background:transparent;border:none;padding:14px 20px;color:white;outline:none;font-size:14px}
.search button{background:#d4af37;border:none;padding:0 26px;font-weight:700;color:#020c1b;cursor:pointer}
.footer{text-align:center;padding:22px;color:#4a5a7a;font-size:11px;border-top:1px solid rgba(255,255,255,0.04)}
@media(max-width:480px){
.hero-circle{width:300px;height:300px}
.desc{max-width:340px;font-size:13.5px}
.search{max-width:360px}
}
</style>
</head>
<body>
<div class="header">
<img src="logo.jpg?v=25" alt="logo" class="logo-circle">
<div class="brand-name">K<span class="sm">itab</span><span style="margin-left:4px">V</span><span class="sm">erse</span></div>
</div>
<div class="hero">
<img src="logo.jpg?v=25" alt="KitabVerse" class="hero-circle">
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>
<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>
</body>
</html>
