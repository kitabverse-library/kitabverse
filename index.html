<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse Library For All</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e8d5a3;font-family:system-ui,sans-serif}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#000;border-bottom:1px solid #222}
.logo{font-family:'Great Vibes',cursive;font-size:34px;color:#d4b86a}
.banner{width:100%;background:#000}
.banner img{width:100%;display:block;max-height:420px;object-fit:cover}
.anthem-box{text-align:center;padding:28px 16px;background:#000}
.anthem-title{font-family:'Great Vibes',cursive;font-size:52px;color:#d4b86a;margin-bottom:16px}
.audio-wrap{display:flex;align-items:center;gap:12px;background:#e9e9ec;border-radius:30px;padding:10px 16px;max-width:520px;margin:0 auto}
.anthem-note{font-family:'Great Vibes',cursive;margin-top:14px;font-size:22px;color:#d4b86a}
.anthem-note b{display:block;font-family:system-ui;letter-spacing:2.5px;font-size:13px;margin-top:6px;font-weight:700}
.search-gold{margin:22px 16px;border:1.5px solid #d4b86a;border-radius:30px;padding:6px 10px;display:flex;align-items:center;background:#000}
.search-gold input{flex:1;background:transparent;border:0;padding:12px 10px;color:#fff;outline:none;font-size:14px}
.s-ic{width:36px;height:36px;border-radius:50%;border:1px solid #d4b86a;background:#000;display:grid;place-items:center;margin-left:6px;color:#d4b86a}
.results{padding:14px;background:#f5f5f7;color:#111;display:grid;gap:10px}
.card{background:#fff;border-radius:16px;padding:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:100}
.sheet.open{display:block}
.sheet-inner{position:absolute;bottom:0;left:0;right:0;background:#111;border-radius:20px 20px 0 0;padding:16px;color:#e8d5a3;border:1px solid #333}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{border:1px solid #333;border-radius:14px;padding:14px;background:#1a1a1a;color:#d4b86a;text-align:left}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d4b86a;color:#000;padding:10px 14px;border-radius:12px;display:none;z-index:200}
.toast.show{display:block}
</style>
</head>
<body>
<div class="topbar"><div class="logo">KitabVerse</div><div style="font-size:26px;color:#d4b86a">☰</div></div>

<div class="banner"><img src="banner.jpg" alt="KitabVerse Banner"></div>

<div class="anthem-box">
<div class="anthem-title">National Anthem</div>
<div class="audio-wrap">
<audio id="anthem" controls style="flex:1"><source src="anthem.mp3" type="audio/mpeg"></audio>
</div>
<div class="anthem-note">Please Respect The National Anthem<br><b>STAND IN HONOUR</b></div>
</div>

<div class="search-gold">
<span>🔍</span><input id="q" placeholder="Search in Kannada • Tulu • Hindi • English..." oninput="doSearch(this.value)">
<button class="s-ic" onclick="openSheet('langSheet')">🌐</button>
<button class="s-ic" onclick="startMic()">🎤</button>
<button class="s-ic" onclick="openSheet('drawSheet')">👆</button>
<button class="s-ic" onclick="openSheet('moreSheet')">⋮</button>
</div>

<div style="display:flex;justify-content:center;gap:10px;padding:10px">
<button class="s-ic" onclick="openSheet('accessSheet')">♿</button>
<button class="s-ic" onclick="speakPage()">🔊</button>
<button class="s-ic" onclick="openSheet('langSheet')">🌐</button>
</div>

<div id="results" class="results"></div>
<div id="toast" class="toast"></div>

<div id="langSheet" class="sheet" onclick="if(event.target==this)closeSheet('langSheet')"><div class="sheet-inner"><div style="display:flex;justify-content:space-between"><h3>All Languages Translator</h3><button onclick="closeSheet('langSheet')">✕</button></div><div id="langList"></div></div></div>
<div id="moreSheet" class="sheet" onclick="if(event.target==this)closeSheet('moreSheet')"><div class="sheet-inner"><div style="display:flex;justify-content:space-between"><h3>More Options</h3><button onclick="closeSheet('moreSheet')">✕</button></div><div class="opt-grid"><button class="opt" onclick="toastMsg('♿ Braille ON')">♿ Braille</button><button class="opt" onclick="toastMsg('◐ Contrast')">◐ High Contrast</button><button class="opt" onclick="speakPage()">🔊 Read Aloud</button><button class="opt" onclick="changeFont(1)">A+ Larger</button><button class="opt" onclick="changeFont(-1)">A- Smaller</button><button class="opt">📚 Library</button><button class="opt">📊 ISO</button><button class="opt">🏛️ Hub</button></div></div></div>
<div id="accessSheet" class="sheet" onclick="closeSheet('accessSheet')"><div class="sheet-inner"><h3>Accessibility</h3></div></div>
<div id="drawSheet" class="sheet" onclick="closeSheet('drawSheet')"><div class="sheet-inner"><h3>Draw Search — Kannada/Tulu</h3><p>Coming V5.1</p></div></div>

<script>
const books=[
{title:"Speaking Shadows - Echoes from the Silent Corners",author:"Your Collection",lang:"English",cat:"Your Book",emoji:"🌑"},
{title:"Dreams Take Flight",author:"Debut Novella",lang:"English",cat:"Your Book - English",emoji:"✈️"},
{title:"Dreams Take Flight - Hindi Edition",author:"Hindi Version",lang:"Hindi",cat:"Your Book - Hindi",emoji:"✈️"},
{title:"Kannada Sahitya",author:"Various",lang:"Kannada",cat:"Regional",emoji:"📚"},
{title:"Tulu Tales",author:"Folk",lang:"Tulu",cat:"Regional",emoji:"📜"},
];
function render(list){document.getElementById('results').innerHTML=list.map(b=>`<div class="card"><b>${b.emoji} ${b.title}</b><div style="color:#666;font-size:13px;margin-top:4px">${b.author} • ${b.lang}</div></div>`).join('')}
function doSearch(q){q=q.toLowerCase();if(!q){render(books);return}render(books.filter(b=>b.title.toLowerCase().includes(q)||b.lang.toLowerCase().includes(q)))}
function openSheet(id){document.getElementById(id).classList.add('open')}function closeSheet(id){document.getElementById(id).classList.remove('open')}
function toastMsg(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function speakPage(){speechSynthesis.speak(new SpeechSynthesisUtterance('Welcome to KitabVerse Library For All'));toastMsg('🔊 Reading')}function startMic(){toastMsg('🎤 Say Speaking Shadows')}let fs=15;function changeFont(d){fs+=d;document.body.style.fontSize=fs+'px'}
render(books);
</script>
</body>
</html>
