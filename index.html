<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020c1b;color:#e6e6e6;font-family:'Montserrat',sans-serif;position:relative;overflow-x:hidden}
/* WATERMARK */
body::before{content:'';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;height:800px;background:url('logo.jpg?v=17') no-repeat center/contain;opacity:0.04;pointer-events:none;z-index:0}
.header{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:14px 4%;background:#020c1b;border-bottom:1px solid #d4af3718}
.logo-circle{width:66px;height:66px;border-radius:50%;object-fit:cover;display:block;flex-shrink:0;background:#020c1b}
.brand{color:#d4af37;line-height:1;white-space:nowrap}
.brand-name{font-family:'Great Vibes',cursive;font-size:44px;letter-spacing:0.5px;line-height:1;display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.brand-name .small{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;font-weight:300}
.brand-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:#e8c873;letter-spacing:1.4px;margin-top:2px}
.brand-line{width:185px;height:1px;background:linear-gradient(90deg,#d4af37,transparent);margin-top:6px;position:relative}
.brand-line::before,.brand-line::after{content:'◆';position:absolute;top:-5px;font-size:6px;color:#d4af37}
.brand-line::before{left:0}.brand-line::after{right:0}
.hero{position:relative;z-index:1;text-align:center;padding:22px 16px 50px}
.hero-circle{width:390px;height:390px;max-width:90vw;max-height:90vw;border-radius:50%;object-fit:cover;display:block;margin:0 auto;box-shadow:0 0 40px #d4af3730;background:#020c1b}
.hero-name{font-family:'Great Vibes',cursive;font-size:72px;color:#d4af37;line-height:1;margin-top:20px;display:flex;justify-content:center;align-items:baseline;gap:8px;white-space:nowrap;flex-wrap:nowrap}
.hero-name .small{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:46px;font-weight:300}
.hero-tag{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:4px;color:#e8c873;margin-top:10px;font-weight:300}
.hero-line{width:340px;max-width:85vw;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:12px auto;position:relative}
.hero-line::before,.hero-line::after{content:'◆';position:absolute;top:-6px;font-size:7px;color:#d4af37}
.hero-line::before{left:0}.hero-line::after{right:0}
.desc{color:#8892b0;max-width:620px;margin:24px auto 0;line-height:1.8;font-size:14.8px;padding:0 10px}
.search{max-width:540px;margin:30px auto;display:flex;background:#112240;border:1px solid #d4af3740;border-radius:30px;overflow:hidden}
.search input{flex:1;background:transparent;border:none;padding:16px 22px;color:white;outline:none;font-size:15px}
.search button{background:#d4af37;border:none;padding:0 30px;font-weight:700;color:#020c1b;cursor:pointer}
.footer{position:relative;z-index:1;text-align:center;padding:30px;color:#5a6a8a;font-size:12px;border-top:1px solid #ffffff08;margin-top:40px}
@media(max-width:400px){.hero-name{font-size:58px;gap:5px}.hero-name .small{font-size:36px}.brand-name{font-size:36px}.brand-name .small{font-size:22px}}
</style>
</head>
<body>
<div class="header">
<img src="logo.jpg?v=17" class="logo-circle" alt="KitabVerse">
<div class="brand">
<div class="brand-name">K<span class="small">itab</span><span style="margin-left:6px">V</span><span class="small">erse</span></div>
<div class="brand-tag">Read. Share. Connect.</div>
<div class="brand-line"></div>
</div>
</div>
<div class="hero">
<img src="logo.jpg?v=17" class="hero-circle" alt="KitabVerse">
<div class="hero-name">K<span class="small">itab</span><span style="margin-left:8px">V</span><span class="small">erse</span></div>
<div class="hero-tag">READ. SHARE. CONNECT.</div>
<div class="hero-line"></div>
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>
<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai</div>
</body>
</html>
