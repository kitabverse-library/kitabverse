<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#020c1b;color:#e6e6e6;font-family:'Segoe UI',sans-serif;width:100%;overflow-x:hidden}
.header{display:flex;align-items:center;gap:10px;padding:14px 5%;background:#020c1b;border-bottom:1px solid rgba(212,175,55,0.08)}
.logo-circle{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#020c1b;border:1px solid rgba(212,175,55,0.18)}
.brand-name{font-family:'Great Vibes',cursive;font-size:30px;color:#d4af37;display:flex;align-items:baseline;white-space:nowrap}
.brand-name .sm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;font-weight:300}
/* DESKTOP IS NOW BIGGER - So Desktop-on-Mobile also looks big */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 16px 40px}
.hero-circle{width:520px;height:520px;max-width:92%;border-radius:50%;object-fit:cover;display:block;background:#020c1b;box-shadow:0 0 80px rgba(212,175,55,0.22);border:1px solid rgba(212,175,55,0.12)}
.desc{color:#8892b0;max-width:600px;margin:32px auto 0;line-height:1.65;font-size:15px;padding:0 12px}
.search{width:100%;max-width:560px;margin:32px auto 0;display:flex;background:#112240;border:1px solid rgba(212,175,55,0.22);border-radius:32px;overflow:hidden}
.search input{flex:1;background:transparent;border:none;padding:16px 22px;color:white;outline:none;font-size:15px}
.search button{background:#d4af37;border:none;padding:0 32px;font-weight:700;color:#020c1b;cursor:pointer;font-size:14px}
.footer{text-align:center;padding:30px 10px;color:#4a5a7a;font-size:11px;border-top:1px solid rgba(255,255,255,0.05);margin-top:10px}
/* MOBILE MODE - Smaller */
@media(max-width:768px){
.hero-circle{width:300px;height:300px;max-width:82vw;max-height:82vw}
.desc{max-width:360px;font-size:13.5px}
.search{max-width:380px}
}
</style>
</head>
<body>
<div class="header">
<img src="logo.jpg?v=28" class="logo-circle">
<div class="brand-name">K<span class="sm">itab</span><span style="margin-left:4px">V</span><span class="sm">erse</span></div>
</div>
<div class="hero">
<img src="logo.jpg?v=28" class="hero-circle">
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>
<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>
</body>
</html>
