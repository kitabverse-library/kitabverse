<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020c1b;color:#e6e6e6;font-family:'Segoe UI',sans-serif;overflow-x:hidden}
.header{
  display:flex;align-items:center;gap:12px;
  padding:14px 4%;background:#020c1b;
  border-bottom:1px solid rgba(212,175,55,0.08);
}
.logo-circle{
  width:54px;height:54px;border-radius:50%;object-fit:cover;
  display:block;background:#020c1b;
  border:1px solid rgba(212,175,55,0.2);
}
.brand{line-height:1;white-space:nowrap}
.brand-name{
  font-family:'Great Vibes',cursive;font-size:34px;color:#d4af37;
  white-space:nowrap;display:flex;align-items:baseline;
}
.brand-name .sm{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:19px;font-weight:300;
}
.hero{text-align:center;padding:28px 16px 70px}
.hero-circle{
  width:360px;height:360px;max-width:88vw;max-height:88vw;
  border-radius:50%;object-fit:cover;display:block;margin:0 auto;
  background:#020c1b;
  box-shadow:0 0 50px rgba(212,175,55,0.15);
  border:1px solid rgba(212,175,55,0.12);
}
.hero-name{
  font-family:'Great Vibes',cursive;font-size:70px;color:#d4af37;
  margin-top:22px;white-space:nowrap;display:flex;
  justify-content:center;align-items:baseline;gap:4px;line-height:1;
}
.hero-name .sm{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:34px;font-weight:300;
}
.desc{
  color:#8892b0;max-width:560px;margin:22px auto 0;
  line-height:1.7;font-size:14px;
}
.search{
  max-width:520px;margin:30px auto 0;display:flex;
  background:#112240;border:1px solid rgba(212,175,55,0.2);
  border-radius:30px;overflow:hidden;
}
.search input{
  flex:1;background:transparent;border:none;
  padding:15px 20px;color:white;outline:none;font-size:14px;
}
.search button{
  background:#d4af37;border:none;padding:0 28px;
  font-weight:700;color:#020c1b;cursor:pointer;font-size:14px;
}
.footer{
  text-align:center;padding:32px;
  color:#5a6a8a;font-size:11px;
  border-top:1px solid rgba(255,255,255,0.05);margin-top:10px;
}
@media(max-width:480px){
  .hero-name{font-size:52px}.hero-name .sm{font-size:26px}
  .hero-circle{width:300px;height:300px}.brand-name{font-size:30px}
}
</style>
</head>
<body>

<div class="header">
  <img src="logo.jpg?v=23" alt="KitabVerse" class="logo-circle">
  <div class="brand">
    <div class="brand-name">K<span class="sm">itab</span><span style="margin-left:5px">V</span><span class="sm">erse</span></div>
  </div>
</div>

<div class="hero">
  <img src="logo.jpg?v=23" alt="KitabVerse" class="hero-circle">
  <div class="hero-name">K<span class="sm">itab</span><span style="margin-left:6px">V</span><span class="sm">erse</span></div>
  <div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
  <div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>

<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>

</body>
</html>
