<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020c1b;color:#e6e6e6;font-family:'Montserrat',sans-serif}
.header{display:flex;align-items:center;gap:14px;padding:12px 4%;background:#020c1b;border-bottom:1px solid #d4af3720}
.logo-circle{width:58px;height:58px;border-radius:0;border:none;object-fit:contain;background:transparent;flex-shrink:0}
.brand{color:#d4af37;display:flex;align-items:baseline;line-height:1}
.big{font-family:'Great Vibes',cursive;font-size:52px}
.small{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:35px}
.tag{font-family:'Cormorant Garamond',serif;color:#e8c873;font-size:12px;letter-spacing:1.2px;margin-top:2px}
.line{width:195px;height:1px;background:linear-gradient(90deg,#d4af37,transparent);margin-top:5px;position:relative}
.line::before,.line::after{content:'◆';position:absolute;top:-5px;font-size:6px;color:#d4af37}
.line::before{left:0}.line::after{right:0}
.hero{text-align:center;padding:50px 20px 40px}
.hero-circle{width:210px;height:210px;border-radius:0;border:none;display:block;margin:0 auto;object-fit:contain;background:transparent;filter:drop-shadow(0 0 25px #d4af3730)}
.hero .brand{justify-content:center;margin-top:20px}
.hero .big{font-size:88px}.hero .small{font-size:62px}
.hero-tag{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:3px;color:#e8c873;margin-top:4px}
.hero .line{width:320px;margin:10px auto;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.desc{color:#8892b0;max-width:620px;margin:24px auto 0;line-height:1.7;font-size:14.5px}
.search{max-width:500px;margin:28px auto;display:flex;background:#112240;border:1px solid #d4af3750;border-radius:30px;overflow:hidden}
.search input{flex:1;background:transparent;border:none;padding:15px 20px;color:white;outline:none;font-size:14px}
.search button{background:#d4af37;border:none;padding:0 28px;font-weight:700;color:#020c1b;cursor:pointer}
.btn{background:#d4af37;color:#020c1b;padding:14px 36px;border-radius:30px;text-decoration:none;font-weight:700;display:inline-block;margin-top:18px}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px #d4af3750}
.footer{text-align:center;padding:28px;color:#5a6a8a;font-size:12px;border-top:1px solid #ffffff0d;margin-top:50px}
</style>
</head>
<body>

<div class="header">
<img src="logo.jpg?v=7" class="logo-circle" alt="KitabVerse">
<div>
<div class="brand"><span class="big">K</span><span class="small">itab</span><span class="big" style="margin-left:6px">V</span><span class="small">erse</span></div>
<div class="tag">Read. Share. Connect.</div>
<div class="line"></div>
</div>
</div>

<div class="hero">
<img src="logo.jpg?v=7" class="hero-circle" alt="KitabVerse Logo">
<div class="brand"><span class="big">K</span><span class="small">itab</span><span class="big" style="margin-left:10px">V</span><span class="small">erse</span></div>
<div class="hero-tag">READ. SHARE. CONNECT.</div>
<div class="line"></div>
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
<a href="#" class="btn">Explore Library →</a>
</div>

<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai</div>

</body>
</html>
