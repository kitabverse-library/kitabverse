<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0d1426;overflow-x:hidden}
body{background:#0d1426;background:radial-gradient(900px 500px at 50% -10%, #1b2744 0%, #0d1426 65%, #080c19 100%);color:#e6e6e6;width:100%;overflow-x:hidden}
.header{display:flex;align-items:center;gap:12px;padding:10px 4%;background:rgba(8,12,25,0.97);border-bottom:1px solid rgba(212,175,55,0.2)}
.logo-circle{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;border:1px solid rgba(212,175,55,0.35)}
.brand-col{display:flex;flex-direction:column;line-height:1}
.brand-name{font-family:'Great Vibes',cursive;font-size:27px;color:#d4af37;display:flex;align-items:baseline;white-space:nowrap}
.brand-name .sm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14.5px;font-weight:300}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;letter-spacing:2.2px;color:#d4af37;opacity:0.85;margin-top:2px;text-transform:uppercase}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px 30px}
.hero-circle-wrap{width:285px;height:285px;max-width:80vw;max-height:80vw;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0a1222;box-shadow:0 0 0 1.5px #d4af37, 0 0 60px rgba(212,175,55,0.3)}
.hero-circle-wrap img{width:103%;height:103%;object-fit:cover;object-position:center;display:block;transform:scale(1.03)}
.desc{color:#9aa8c7;max-width:500px;margin:18px auto 0;line-height:1.65;font-size:14.5px;font-family:'Cormorant Garamond',serif;font-style:italic;padding:0 12px;font-weight:300}
.search{width:100%;max-width:460px;margin:20px auto 0;display:flex;background:#16223d;border:1px solid rgba(212,175,55,0.25);border-radius:30px;overflow:hidden}
.search input{flex:1;background:transparent;border:none;padding:13px 18px;color:#fff;outline:none;font-size:14px;font-family:'Cormorant Garamond',serif}
.search input::placeholder{color:#6b7fa3}
.search button{background:linear-gradient(135deg,#d4af37,#f0d27a);border:none;padding:0 28px;font-weight:700;color:#0d1426;cursor:pointer;font-family:'Cormorant Garamond',serif}
.footer{text-align:center;padding:18px 10px;color:#6b7fa3;font-size:11px;border-top:1px solid rgba(255,255,255,0.07);margin-top:20px}
@media (min-width:1024px) and (hover:hover){
body{min-height:100vh;display:flex;flex-direction:column}
.hero{flex:1;justify-content:center;padding:60px 40px}
.hero-circle-wrap{width:395px;height:395px;box-shadow:0 0 0 2px #d4af37, 0 0 85px rgba(212,175,55,0.4)}
.desc{font-size:16.5px;max-width:560px}
.search{max-width:520px;height:52px}
.footer{margin-top:auto}
}
</style>
</head>
<body>
<div class="header">
<img src="logo.jpg?v=44" class="logo-circle" alt="KitabVerse">
<div class="brand-col">
<div class="brand-name">K<span class="sm">itab</span><span style="margin-left:2px">V</span><span class="sm">erse</span></div>
<div class="tagline">Read. Share. Connect.</div>
</div>
</div>
<div class="hero">
<div class="hero-circle-wrap"><img src="logo.jpg?v=44" alt="KitabVerse"></div>
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>
<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>
</body>
</html>
