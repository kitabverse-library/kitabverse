<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#070a12}
body{background:#070a12;background:radial-gradient(800px 400px at 50% 0%, #121a2e 0%, #070a12 55%, #05070e 100%);color:#e6e6e6;width:100%;display:block;min-height:100vh}
.header{display:flex;align-items:center;gap:13px;padding:11px 5%;background:rgba(7,10,18,0.95);border-bottom:1px solid rgba(212,175,55,0.15);position:sticky;top:0;z-index:10}
.logo-circle{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid rgba(212,175,55,0.22);background:#070a12}
.brand-col{display:flex;flex-direction:column;line-height:1.05}
.brand-name{font-family:'Great Vibes',cursive;font-size:28px;color:#d4af37;display:flex;align-items:baseline;white-space:nowrap}
.brand-name .sm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;font-weight:300}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10.5px;letter-spacing:2px;color:#d4af37;opacity:0.85;margin-top:2px;font-weight:300;text-transform:uppercase}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 16px 40px}
.hero-circle{width:340px;height:340px;max-width:82vw;max-height:82vw;border-radius:50%;object-fit:cover;display:block;background:#070a12;box-shadow:0 0 0 1px rgba(212,175,55,0.18), 0 0 80px rgba(212,175,55,0.22), 0 20px 60px rgba(0,0,0,0.6)}
.desc{color:#8c98b3;max-width:520px;margin:28px auto 0;line-height:1.7;font-size:15px;font-family:'Cormorant Garamond',serif;font-style:italic;padding:0 12px;font-weight:300}
.search{width:100%;max-width:500px;margin:30px auto 0;display:flex;background:#10182b;border:1px solid rgba(212,175,55,0.22);border-radius:30px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.search input{flex:1;background:transparent;border:none;padding:14px 20px;color:white;outline:none;font-size:14px;font-family:'Cormorant Garamond',serif}
.search input::placeholder{color:#5a6a8a}
.search button{background:linear-gradient(135deg,#d4af37,#f0d27a);border:none;padding:0 28px;font-weight:700;color:#070a12;cursor:pointer;font-family:'Cormorant Garamond',serif;letter-spacing:0.5px}
.footer{text-align:center;padding:24px 10px 60px;color:#5a6783;font-size:11px;border-top:1px solid rgba(255,255,255,0.06);margin-top:12px;letter-spacing:0.4px}
@media(max-width:768px){.hero-circle{width:300px;height:300px}.brand-name{font-size:26px}.tagline{font-size:10px;letter-spacing:1.6px}}
</style>
</head>
<body>
<div class="header">
<img src="logo.jpg?v=35" class="logo-circle" alt="KitabVerse Logo">
<div class="brand-col">
<div class="brand-name">K<span class="sm">itab</span><span style="margin-left:2px">V</span><span class="sm">erse</span></div>
<div class="tagline">Read. Share. Connect.</div>
</div>
</div>
<div class="hero">
<img src="logo.jpg?v=35" class="hero-circle" alt="KitabVerse">
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>
<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>
</body>
</html>
