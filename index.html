<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KitabVerse - Read. Share. Connect.</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0d1426;min-height:100%}
body{background:#0d1426;background:radial-gradient(900px 500px at 50% -10%, #1b2744 0%, #0d1426 55%, #080c19 100%);color:#e6e6e6;width:100%;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:12px;padding:10px 4%;background:rgba(8,12,25,0.96);border-bottom:1px solid rgba(212,175,55,0.18);flex-shrink:0}
.logo-circle{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;border:1px solid rgba(212,175,55,0.3)}
.brand-col{display:flex;flex-direction:column;line-height:1.05}
.brand-name{font-family:'Great Vibes',cursive;font-size:27px;color:#d4af37;display:flex;align-items:baseline;white-space:nowrap}
.brand-name .sm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14.5px}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;letter-spacing:2px;color:#d4af37;opacity:0.85;margin-top:1px;text-transform:uppercase}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 16px 20px}
.hero-circle-wrap{width:285px;height:285px;max-width:78vw;max-height:78vw;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0a1222;box-shadow:0 0 0 1.5px #d4af37, 0 0 55px rgba(212,175,55,0.28);flex-shrink:0}
.hero-circle-wrap img{width:102%;height:102%;object-fit:cover;object-position:center;display:block;transform:scale(1.02)}
.desc{color:#9aa8c7;max-width:500px;margin:20px auto 0;line-height:1.6;font-size:14.5px;font-family:'Cormorant Garamond',serif;font-style:italic;padding:0 12px}
.search{width:100%;max-width:460px;margin:22px auto 0;display:flex;background:#16223d;border:1px solid rgba(212,175,55,0.22);border-radius:30px;overflow:hidden}
.search input{flex:1;background:transparent;border:none;padding:13px 18px;color:white;outline:none;font-size:14px;font-family:'Cormorant Garamond',serif}
.search button{background:linear-gradient(135deg,#d4af37,#f0d27a);border:none;padding:0 26px;font-weight:700;color:#0d1426;cursor:pointer;font-family:'Cormorant Garamond',serif}
.footer{text-align:center;padding:16px 10px;color:#6b7fa3;font-size:11px;border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0;margin-top:auto}
</style>
</head>
<body>
<div class="header">
<img src="logo.jpg?v=39" class="logo-circle" alt="Logo">
<div class="brand-col">
<div class="brand-name">K<span class="sm">itab</span><span style="margin-left:2px">V</span><span class="sm">erse</span></div>
<div class="tagline">Read. Share. Connect.</div>
</div>
</div>
<div class="hero">
<div class="hero-circle-wrap"><img src="logo.jpg?v=39" alt="KitabVerse"></div>
<div class="desc">The most premium digital library experience. Borrow books from neighbors, share your collection, and connect with readers across Mumbai. Zero cost, pure knowledge.</div>
<div class="search"><input placeholder="Search 10,000+ books..."><button>Search</button></div>
</div>
<div class="footer">KitabVerse © 2026 · Made for readers in Mumbai · Secure & Private</div>
</body>
</html>
