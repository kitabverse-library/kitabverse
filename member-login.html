<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KitabVerse - Member Login</title>
<style>
body{font-family:Arial;background:#f5f0e6;padding:15px}
.card{max-width:480px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 20px #0002}
h2{text-align:center;color:#6b3f00} label{display:block;margin-top:12px;font-weight:bold;font-size:14px}
input{width:100%;padding:11px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:14px;background:#6b3f00;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:bold}
.tab{display:flex;gap:8px} .tab button{background:#eee;color:#333} .tab button.active{background:#6b3f00;color:#fff}
.box{margin-top:10px} .msg{margin-top:12px;text-align:center;font-weight:bold}
</style></head><body>
<div class="card">
<h2>📚 KitabVerse<br>Member Login</h2>
<div class="tab">
<button id="t1" class="active">Member ID + PIN</button>
</div>

<!-- OPTION 1 -->
<div id="login-pin" class="box">
<label>Membership ID:</label><input id="mid" placeholder="KV-MUM-2026-000001">
<label>PIN (Given by KitabVerse):</label><input id="pin" type="password" placeholder="">
<button onclick="loginPin()">Login with PIN</button>
</div>

<div id="msg" class="msg"></div>
<p style="text-align:center;font-size:13px"><a href="member-register.html">New Member? Register Here →</a></p>
</div>

<script>
function loginPin(){
  const id=document.getElementById('mid').value.trim().toUpperCase();
  const pin=document.getElementById('pin').value.trim();

  // ADMIN LOGIN - No Registration Needed
  if(id==='ADMIN-001' && pin==='9999'){
    localStorage.setItem('kv_loggedin', JSON.stringify({id:'ADMIN-001', name:'Admin', pin:'9999'}));
    window.location.href='member-dashboard.html';
    return;
  }

  let members=JSON.parse(localStorage.getItem('kv_members')||'[]');
  let m=members.find(x=>x.id===id && x.pin===pin);
  if(m){
    localStorage.setItem('kv_loggedin', JSON.stringify(m));
    window.location.href='member-dashboard.html';
  } else {
    document.getElementById('msg').style.color='red';
    document.getElementById('msg').innerHTML='❌ Invalid ID or PIN. Check WhatsApp PIN from KitabVerse.';
  }
}
</script></body></html>
