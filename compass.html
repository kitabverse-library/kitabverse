<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass - KitabVerse</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#000;color:#fff;padding:20px;text-align:center}
  .top{display:flex;justify-content:space-between;font-size:14px}
  .top a{color:#fff;text-decoration:none}
  h1{font-size:32px;margin:20px 0}
  h1 span{color:#FFD700}
  .offline{font-size:12px;background:#0a3;padding:4px 10px;border-radius:20px}
  .compass-box{width:220px;height:220px;margin:25px auto;border:3px solid #FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#111}
  .compass-box .arrow{font-size:60px;color:#FFD700}
  .compass-box p{color:#ccc;margin-top:8px}
  .card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;max-width:600px;margin:20px auto;text-align:left}
  .card h3{margin-bottom:12px}
  .row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .row input,.row select{flex:1;padding:12px;border-radius:10px;border:0;outline:none;font-size:15px;color:#000;background:#fff;min-width:140px}
  .btn{background:#FFD700;color:#000;padding:12px 20px;border-radius:25px;font-weight:700;border:0;cursor:pointer;width:100%;margin-top:5px}
  .btn.off{background:#222;color:#FFD700;border:1px solid #FFD700}
  .custom-list{margin-top:12px}
  .custom-item{background:#222;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:8px}
  .custom-item button{background:red;color:#fff;border:0;padding:4px 10px;border-radius:10px;cursor:pointer}
  .footer{color:#888;font-size:12px;margin-top:20px}
</style>
</head>
<body>

<div class="top">
  <a href="index.html">← Back To Home</a>
  <a href="index.html">Home</a>
</div>

<h1>Kitab<span>Verse</span> Compass</h1>
<span class="offline">● Offline Ready — Compass Works Without Internet</span>

<div class="compass-box">
  <div class="arrow">🧭 ↑</div>
  <p>North • Facing Shelf A-12</p>
  <p style="color:#FFD700;font-weight:700">12 Steps Ahead</p>
</div>

<!-- DDC + CALL NO -->
<div class="card">
  <h3>📚 Find Book Location</h3>
  <div class="row">
    <input id="ddcInput" placeholder="DDC No. e.g. 823.914">
    <input id="callInput" placeholder="Call No. e.g. FIC-SHA">
  </div>
  <div class="row">
    <select id="shelfSelect">
      <option>Shelf A-12 - Fiction</option>
      <option>Shelf B-05 - Science</option>
      <option>Shelf C-08 - History</option>
      <option>Custom Shelf...</option>
    </select>
  </div>
  <button class="btn" onclick="findBook()">Find My Book →</button>
  <button class="btn off" onclick="scanBook()">📷 Scan Barcode — Offline</button>
</div>

<!-- CUSTOM (+) -->
<div class="card">
  <h3>➕ Custom DDC & Call No.</h3>
  <p style="color:#ccc;font-size:13px;margin-bottom:12px">Add Your Own DDC / Call No. — Saved Offline</p>
  <div class="row">
    <input id="customDDC" placeholder="Custom DDC e.g. 025.4">
    <input id="customCall" placeholder="Custom Call No. e.g. LIB-001">
  </div>
  <div class="row">
    <input id="customName" placeholder="Book / Shelf Name e.g. My Notes Shelf">
  </div>
  <button class="btn" onclick="addCustom()">+ Add Custom</button>
  <div class="custom-list" id="customList"></div>
</div>

<div class="footer">KitabVerse © 2026 | Compass Works Offline</div>

<script>
  // Load saved customs offline
  let customs = JSON.parse(localStorage.getItem('customDDCList') || '[]');
  renderCustom();

  function findBook(){
    let ddc = document.getElementById('ddcInput').value || '823.914';
    let call = document.getElementById('callInput').value || 'FIC-SHA';
    localStorage.setItem('lastDDC', ddc);
    localStorage.setItem('lastCall', call);
    alert('Found! DDC: ' + ddc + ' | Call: ' + call + '\nShelf A-12 | 12 Steps Ahead | Offline Saved');
  }
  function scanBook(){ alert('Scanner Open — Works Offline, Sync Later'); }

  function addCustom(){
    let ddc = document.getElementById('customDDC').value;
    let call = document.getElementById('customCall').value;
    let name = document.getElementById('customName').value;
    if(!ddc || !call){ alert('Please Enter DDC + Call No.'); return; }
    customs.push({ddc, call, name});
    localStorage.setItem('customDDCList', JSON.stringify(customs));
    renderCustom();
    document.getElementById('customDDC').value='';
    document.getElementById('customCall').value='';
    document.getElementById('customName').value='';
  }
  function renderCustom(){
    let box = document.getElementById('customList');
    box.innerHTML = customs.map((c,i)=>`
      <div class="custom-item">
        <span><b>${c.ddc}</b> | ${c.call} ${c.name ? '— '+c.name : ''}</span>
        <button onclick="delCustom(${i})">X</button>
      </div>`).join('');
  }
  function delCustom(i){
    customs.splice(i,1);
    localStorage.setItem('customDDCList', JSON.stringify(customs));
    renderCustom();
  }
</script>
</body>
</html>
